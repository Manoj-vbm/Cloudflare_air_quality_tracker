<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Pollution Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Air Pollution Levels in 5 Cities</h1>
        <form id="city-form">
            <input type="text" id="city-name" placeholder="City Name" required>
            <input type="number" id="city-lat" placeholder="Latitude" required>
            <input type="number" id="city-lon" placeholder="Longitude" required>
            <button type="submit">Add City</button>
        </form>
        <div id="cities">
            <!-- Cities data will be dynamically inserted here -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
